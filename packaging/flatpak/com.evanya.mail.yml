app-id: com.evanya.mail
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: evanya
separate-locales: false

# The app already uses portals for browser and file-picker requests. Credential
# storage uses the freedesktop Secret Service. The Flatpak feature disables the
# legacy StatusNotifier tray backend so the sandbox needs no unsafe D-Bus name.
finish-args:
  - --share=ipc
  - --share=network
  - --device=dri
  - --socket=wayland
  - --socket=fallback-x11
  - --talk-name=org.freedesktop.secrets

cleanup:
  - /include
  - /lib/pkgconfig
  - /share/pkgconfig
  - /share/man
  - '*.a'
  - '*.la'

modules:
  - name: evanya
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_BUILD_JOBS: '1'
        CARGO_HOME: /run/build/evanya/cargo
        CARGO_NET_OFFLINE: 'true'
    build-commands:
      - cargo build --offline --locked --release --no-default-features --features remote-content,gpu-renderer,flatpak --bin evanya
      - install -Dm0755 target/release/evanya /app/bin/evanya
      - install -Dm0755 pdfium-runtime/lib/libpdfium.so /app/lib/evanya/libpdfium.so
      - python3 scripts/test-pdf-preview.py /app/bin/evanya
      - python3 scripts/stage-linux-metadata.py --flatpak _flatpak-stage
      - install -Dm0644 _flatpak-stage/usr/share/applications/com.evanya.mail.desktop /app/share/applications/com.evanya.mail.desktop
      - install -Dm0644 _flatpak-stage/usr/share/metainfo/com.evanya.mail.metainfo.xml /app/share/metainfo/com.evanya.mail.metainfo.xml
      - install -Dm0644 resources/app-icon/evanya-masked-512.png /app/share/icons/hicolor/512x512/apps/com.evanya.mail.png
      - install -Dm0644 resources/app-icon/evanya-masked.svg /app/share/icons/hicolor/scalable/apps/com.evanya.mail.svg
      - install -Dm0644 LICENSE /app/share/licenses/evanya/LICENSE
      - cp -a LICENSES /app/share/licenses/evanya/LICENSES
      - install -Dm0644 THIRD_PARTY_NOTICES.md /app/share/doc/evanya/THIRD_PARTY_NOTICES.md
      - install -Dm0644 resources/fonts/google-sans-flex/OFL.txt /app/share/licenses/evanya/google-sans-flex/OFL.txt
      - install -Dm0644 resources/fonts/google-sans-flex/README.md /app/share/doc/evanya/google-sans-flex/README.md
      - mkdir -p /app/share/licenses/evanya/pdfium
      - cp -a pdfium-runtime/LICENSE pdfium-runtime/licenses /app/share/licenses/evanya/pdfium/
    sources:
      # Package the exact checkout selected by the release workflow.
      - type: dir
        path: ../..
        skip:
          - .artifacts
          - .devcontainer
          - .env
          - .flatpak-builder
          - .git
          - .idea
          - .Trash-*
          - .vscode
          - libs
          - target
          - tmp
      - cargo-sources.json
      # Include PDF preview in the standalone alpha bundle.
      - type: archive
        url: https://github.com/bblanchon/pdfium-binaries/releases/download/chromium%2F8044/pdfium-linux-x64.tgz
        sha256: eb142f416aed3a72fc5a02dbd5884868a16cb99dc0cf53e6bdd64afbf67b05f4
        dest: pdfium-runtime
        strip-components: 0
        only-arches:
          - x86_64
