[package]
name = "evanya-ohos"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "AGPL-3.0-only"
description = "Evanya shell for OpenHarmony"
publish = false

[lib]
name = "evanya_ohos"
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
libc = "0.2"
evanya = { path = "../../..", default-features = false, features = ["remote-content", "gpu-renderer"] }
slint-ohos-backend = { path = "../backend" }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"] }
